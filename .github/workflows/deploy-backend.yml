name: Deploy

on:
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  deploy:
    name: Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
