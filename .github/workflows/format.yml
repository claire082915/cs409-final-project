name: CI

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.prettierrc']

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Keep the version in sync with backend/package.json, skip folders that don't exist yet
      - name: Check formatting
        run: npx prettier@3.9.10 --check --no-error-on-unmatched-pattern backend frontend
